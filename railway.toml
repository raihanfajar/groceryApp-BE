[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 180
healthcheckInterval = 30
restartPolicyType = "on_failure"
PORT = "8000"

[deploy.phases]
# Give more time for cache initialization
preStartCommand = "sleep 10"

[deploy.envs]
NODE_ENV = "production"