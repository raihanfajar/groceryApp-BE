<!doctype html>
<html>
	<head>
		<title>Order Shipped</title>
	</head>
	<body
		style="
			margin: 0;
			padding: 0;
			background-color: #f5f5f5;
			font-family: Arial, sans-serif;
		"
	>
		<div
			style="
				max-width: 600px;
				margin: 40px auto;
				background-color: #ffffff;
				border-radius: 16px;
			"
		>
			<div style="background-color: #dbfce7; padding: 32px; text-align: center">
				<h1 style="font-size: 28px; margin: 0; color: #2d4c51">
					Order Shipped
				</h1>
				<p style="margin: 8px 0 0 0; color: #173226">
					Your package is on its way!
				</p>
			</div>
			<div style="padding: 32px; color: #333333">
				<p style="font-size: 18px; color: #2d4c51">Hello {{name}},</p>
				<p>
					Good news! Your order with number
					<strong>#{{orderId}}</strong> has been shipped and is on its way to
					your address.
				</p>
				<p>You can view your order details by clicking the button below.</p>
			</div>
			<div
				style="
					background-color: #f5f5f5;
					color: #666666;
					padding: 20px;
					text-align: center;
					font-size: 12px;
				"
			>
				<p style="margin: 0">&copy; 2025 FreshNear. All Rights Reserved.</p>
			</div>
		</div>
	</body>
</html>
